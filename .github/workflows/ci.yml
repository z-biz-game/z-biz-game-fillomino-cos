name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: syntax + engine guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install: the game has zero runtime dependencies, and pulling Electron into
      # CI to prove nothing is how a repo starts failing on a network flake.
      - name: Syntax check every source
        run: npm run check
      # The real gate: every generated board must have one solution and be reachable by
      # pencil logic. This is a plain Node test, so it guards merges without a browser.
      - name: Engine tests
        run: node tools/engine-test.mjs

      # 垃圾档解码与动效定步长：一条坏记录只丢那一条，彩带在 30/60/120Hz 下积出同一条轨迹。
      # 这两件事在真浏览器里几乎不可测（帧率不由你定），所以钉在纯 node 这一层。
      - name: Save decode and fixed-step fx ladder
        run: node tools/store-fx-test.mjs

      # 关卡**内**的三档对拍：真进对局、按整 100ms 刻度喂 30/60/120Hz，逐字段比用时时钟、
      # sim 步数、步数/提示计费、已写/待写/成块/冲突/难度分与动效场，并自带一发阴性对照
      # （把 fx.js 的 accum += elapsed 改成 += SIM_STEP，跑在 /tmp 的源码副本上，必须判红）。
      - name: In-level frame-rate ladder (30/60/120Hz, same virtual time)
        run: node tools/frame-ladder-test.mjs

      # §2 那批判据（静音真停 AudioContext、暂停真不推进仿真、重开真复位、触屏坐标按 CSS
      # 缩放换算、键位全覆盖、省动效真分支、全屏绑真实存在的 id）在 sellability 里只是字符串，
      # 这里用一层最小 DOM 桩把 js/main.js 当真入口装载并读出数——纯 node，不需要 Chrome。
      - name: Behavior gate (mute / pause / restart / touch scale / keys / reduced motion)
        run: node tools/dom-behavior-test.mjs

      # Pages 那条腿的拷贝清单与这里共用 tools/assemble_site.sh：装配完逐条核对
      # index.html 与 manifest 声明过的每个同源路径都进了产物。清单漂移因此在 PR 上红，
      # 而不是等部署站上图标、manifest、sw.js、纹理全 404 才发现。
      - name: Site assembly ships every declared path
        run: bash tools/assemble_site.sh "$RUNNER_TEMP/_site"

      # The ladder is a promise, not a caption: `TIERS[].band` is a selection target, and this
      # step goes red if a tier stops landing in its own band or the medians stop ordering.
      - name: Difficulty ladder is still measured
        run: node tools/balance.mjs
        env:
          SAMPLES: "24"

      - name: Entry files exist
        run: test -f index.html && grep -q '<canvas' index.html && grep -q 'js/main.js' index.html
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs

  # 真浏览器闸：headless Chrome + CDP，读 DOM 文本/几何与画布像素，不读内部标志位。
  # 独立 job，node 22 而不是 check job 的 20：台架是裸 CDP 驱动，用的是 Node 22 才有的全局
  # WebSocket/fetch；在 20 上第一次 attach 就死在 "WebSocket is not defined"，一条断言都跑不到。
  browser:
    name: real browser gate (both URL shapes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 655 项浏览器断言（11 个场景 boot paint hint region conflict save resume reload records motion layout（layout 在 3 个视口各跑一遍））在两种 URL 形态下的条数逐条相同，是 2026-09-28 在本机实跑出来的，
      # 不是引用。在这一步之前 CI 一步都没跑过 tools/verify.sh：闸是写了给人看的，不是给人跑的。
      - name: Browser gate, root shape
        env:
          WD_TIMEOUT: 900
        run: bash tools/verify.sh

      # Pages 把这个仓发在 /z-biz-game-fillomino-cos/ 之下，而根形态的服务方式分辨不出斜杠开头的 import——
      # 同组织已经因此红过一次（部署站上 404，本地闸全绿）。所以前缀形态也是闸的一部分。
      - name: Browser gate, prefix shape (how Pages serves us)
        env:
          WD_TIMEOUT: 900
        run: |
          root=$(mktemp -d)
          ln -s "$GITHUB_WORKSPACE" "$root/z-biz-game-fillomino-cos"
          python3 -m http.server 5508 --bind 127.0.0.1 --directory "$root" &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null' EXIT
          for i in $(seq 1 40); do
            curl -fsS -m 2 "http://127.0.0.1:5508/z-biz-game-fillomino-cos/" >/dev/null 2>&1 && break
            sleep 0.25
          done
          curl -fsS -m 3 "http://127.0.0.1:5508/z-biz-game-fillomino-cos/js/main.js" >/dev/null
          curl -fsS -m 3 "http://127.0.0.1:5508/z-biz-game-fillomino-cos/js/engine/count.js" >/dev/null
          BASE_URL=http://127.0.0.1:5508/z-biz-game-fillomino-cos/ bash tools/verify.sh
